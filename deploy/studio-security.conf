# En-têtes de sécurité et de cache de studio.glsc.fr.
# Installé par deploy.sh dans /etc/nginx/snippets/studio-security.conf ; à inclure UNE FOIS dans le bloc « server » de studio.glsc.fr :
#
#     include snippets/studio-security.conf;
#
# puis : nginx -t && systemctl reload nginx
# Aucune page n'appelle de service tiers : polices, styles, scripts et visuels sont hébergés sur le site.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

# Les démos (/demos/…) sont servies sous la même politique stricte que le reste : aucune ressource externe, aucun script en ligne.

# Cache : les polices et images ne changent pas ; CSS et JS ne portent pas d'empreinte, donc revalidation quotidienne.
location ~* \.(woff2|webp|png|svg|ico)$ { expires 30d; add_header Cache-Control "public, max-age=2592000" always; add_header X-Content-Type-Options "nosniff" always; }
location ~* \.(css|js|json)$ { expires 1d; add_header Cache-Control "public, max-age=86400, must-revalidate" always; add_header X-Content-Type-Options "nosniff" always; }

# Service StudioGLSC (formulaire de contact + espace de suivi client) : conteneur local, port public 3302 (le port admin 3303 n'est jamais exposé).
# Les requêtes d'écriture sont limitées à 9 Mo (fichiers de 8 Mo maximum). Pas de mise en cache des réponses.
location /api/ {
    client_max_body_size 9m;
    proxy_pass http://127.0.0.1:3302/;   # le slash final retire le préfixe /api
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

# Page de suivi privée : jamais indexée ni mise en cache.
location = /suivi/ {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}

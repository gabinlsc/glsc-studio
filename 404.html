<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="robots" content="noindex,follow">
  <title>Page introuvable — StudioGLSC</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/studio.css">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('studioglsc-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .nf { position: relative; width: min(100%, 640px); padding: clamp(32px, 7vw, 64px); border: 1px solid var(--line); border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); text-align: center; }
    .nf .brand { justify-content: center; }
    .nf-code { margin-top: 48px; font: 700 clamp(5rem, 20vw, 8.5rem)/.9 var(--font-display); letter-spacing: -.05em; background: linear-gradient(100deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #7c3aed)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .nf h1 { margin-top: 20px; font-size: clamp(1.6rem, 4.5vw, 2.2rem); line-height: 1.15; }
    .nf p { max-width: 42ch; margin: 14px auto 0; color: var(--muted); }
    .nf .btn-row { justify-content: center; margin-top: 28px; }
    .nf-search { margin-top: 28px; text-align: left; }
    .nf-search label { display: block; margin-bottom: 8px; font-size: .85rem; font-weight: 600; }
    .nf-search input { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--bg); color: var(--ink); font: 400 1rem/1.4 var(--font); }
    .nf-search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .nf-results { display: grid; gap: 8px; margin-top: 12px; }
    .nf-results a { display: block; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); text-decoration: none; }
    .nf-results a:hover, .nf-results a:focus-visible { border-color: var(--accent); }
    .nf-results strong { display: block; font-weight: 600; font-size: .95rem; }
    .nf-results span { color: var(--muted); font-size: .85rem; }
    .nf .nf-hint { margin: 10px 0 0; max-width: none; text-align: left; color: var(--muted); font-size: .88rem; }
  </style>
</head>
<body>
  <main class="nf">
    <a class="brand" href="/" aria-label="StudioGLSC, accueil"><span class="logo-mark" aria-hidden="true">G</span><span class="wordmark">Studio<span>GLSC</span></span></a>
    <p class="nf-code" aria-hidden="true">404</p>
    <h1>Cette page est introuvable.</h1>
    <p>Le lien a peut-être changé. Vous pouvez revenir à l’accueil ou consulter les offres.</p>
    <div class="btn-row">
      <a class="btn btn-primary" href="/">Retour à l’accueil</a>
      <a class="btn btn-secondary" href="/#offres">Voir les offres</a>
    </div>
    <form class="nf-search" id="nf-search" role="search" onsubmit="return false" hidden>
      <label for="nf-q">Chercher une page du site</label>
      <input id="nf-q" type="search" placeholder="Tarifs, plombier, Lorient, mentions légales…" autocomplete="off">
      <p class="nf-hint" id="nf-hint" aria-live="polite"></p>
      <div class="nf-results" id="nf-results"></div>
    </form>
  </main>
  <script src="/assets/notfound.js" defer></script>
</body>
</html>
